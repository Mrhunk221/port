<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Imran | BCA Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Hero background */
    header {
      background: url('https://source.unsplash.com/1600x900/?technology,code') no-repeat center center/cover;
      color: white;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
    }

    /* Typing effect */
    .typing {
      border-right: 2px solid white;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 4s steps(40, end), blink 0.75s step-end infinite;
    }
    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink { 50% { border-color: transparent } }

    /* Card hover animation */
    .card {
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Dark mode */
    .dark-mode {
      background-color: #121212 !important;
      color: #f1f1f1 !important;
    }
    .dark-mode .card {
      background-color: #1e1e1e;
      color: #f1f1f1;
    }
    .dark-mode footer {
      background-color: #000 !important;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Hero Section -->
  <header class="text-center py-5">
    <h1 class="typing">Imran | BCA Student | Algorithm Enthusiast</h1>
    <p class="mt-3">Building technical solutions with code & creativity</p>
    <button id="darkModeToggle" class="btn btn-secondary mt-3">Toggle Dark Mode</button>
  </header>

  <!-- Skills Section -->
  <section id="skills" class="container my-5">
    <h2 class="text-primary">Skills</h2>
    <div class="progress my-3">
      <div class="progress-bar bg-success" style="width: 80%">Python</div>
    </div>
    <div class="progress my-3">
      <div class="progress-bar bg-info" style="width: 70%">Web Development</div>
    </div>
    <div class="progress my-3">
      <div class="progress-bar bg-warning" style="width: 85%">Algorithms</div>
    </div>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="container my-5">
    <h2 class="text-primary">Projects</h2>
    <div class="row">
      <div class="col-md-4">
        <div class="card shadow">
          <img src="https://source.unsplash.com/400x250/?algorithm,code" class="card-img-top" alt="Project Screenshot">
          <div class="card-body">
            <h5 class="card-title">Algorithm Visualizer</h5>
            <p class="card-text">Interactive tool to demonstrate sorting and graph traversal techniques.</p>
            <a href="https://github.com/Mrhunk221/algorithm-visualizer" class="btn btn-primary">View Code</a>
          </div>
        </div>
      </div>
      <!-- Add more project cards here -->
    </div>
  </section>

  <!-- Contact Section -->
  <footer class="bg-dark text-white text-center py-4">
    <p>Email: imran@example.com | Bengaluru</p>
    <p>
      <a href="https://github.com/Mrhunk221" class="text-white me-3"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/in/yourusername" class="text-white"><i class="fab fa-linkedin"></i></a>
    </p>
  </footer>

  <!-- Dark Mode Script -->
  <script>
    const toggle = document.getElementById('darkModeToggle');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
